<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe</title>
<meta name="description" content="Recetas a tu punto. Feed personalizado y escaneo de nevera.">
<meta name="theme-color" content="#F7F2E7">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { overflow: hidden; }

  #ob-carousel {
    height: 100vh; height: 100dvh;
    width: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #ob-carousel::-webkit-scrollbar { display: none; }

  .ob-slide {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background-size: cover;
    background-position: center;
    position: relative;
  }

  #google-hit {
    position: absolute;
    left: 11%; width: 78%;
    top: 69%; height: 8.5%;
    background: transparent;
    border: none;
  }
</style>
</head>
<body>

<div id="splash">
  <span class="logo-lockup">
    <span class="wordmark">Nappe</span>
    <svg class="hat" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 24c-3 0-5-2.2-5-5s2-5 5-5c.4-3 3-5.3 6-5.3s5.6 2.3 6 5.3c2.6 0 4.8 1.9 5 4.4.1 2.8-2.1 5.1-5 5.1H9Z" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
  </span>
  <div class="bar"><i></i></div>
</div>

<div id="ob-carousel">
  <div class="ob-slide" style="background-image:url('img/onboarding/welcome.jpg');"></div>
  <div class="ob-slide" style="background-image:url('img/onboarding/nevera.jpg');"></div>
  <div class="ob-slide" style="background-image:url('img/onboarding/cocina.jpg');"></div>
  <div class="ob-slide" style="background-image:url('img/onboarding/feed.jpg');"></div>
  <div class="ob-slide" style="background-image:url('img/onboarding/login.jpg');">
    <button type="button" id="google-hit" aria-label="Continuar con Google"></button>
  </div>
</div>

<script type="module">
import { supabase, getSession, getProfile } from './js/supabase-client.js';
import { toast } from './js/utils.js';

async function goToApp(user) {
  try {
    const profile = await getProfile(user.id);
    if (profile && profile.onboarding_done) {
      window.location.href = 'app.html';
    } else {
      window.location.href = 'onboarding.html';
    }
  } catch {
    window.location.href = 'onboarding.html';
  }
}

document.getElementById('google-hit').addEventListener('click', async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) toast(error.message);
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) goToApp(session.user);
});

const minSplash = new Promise((r) => setTimeout(r, 900));

async function init() {
  const session = await getSession();
  if (session) {
    goToApp(session.user);
    return;
  }
  await minSplash;
  const splash = document.getElementById('splash');
  splash.classList.add('out');
  setTimeout(() => splash.remove(), 450);
}

init();
</script>
</body>
</html>
