<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe</title>
<meta name="description" content="Recetas a tu punto. Feed personalizado y escaneo de nevera.">
<meta name="theme-color" content="#EDEFEF">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="screen">
  <div class="wrap grow center" style="padding-top: calc(60px + env(safe-area-inset-top)); padding-bottom: 40px;">

    <div style="margin-bottom: 56px;">
      <h1 style="font-size: 2.9rem; margin-bottom: 4px; text-transform: uppercase;">Nappe</h1>
      <p style="color: var(--fg-faint); text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.1em; font-weight: 600;">
        Recetas a tu punto
      </p>
    </div>

    <div id="auth-view" style="width: 100%;">

      <div id="signed-out">
        <button type="button" class="btn btn-ghost" id="google-btn" style="background:var(--bg-raised); text-transform:none; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; font-size:0.95rem; letter-spacing:0;">
          <svg width="19" height="19" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Continuar con Google
        </button>

        <p id="auth-msg" style="margin-top: 20px; font-size: 0.85rem; min-height: 1.2em;"></p>
      </div>

      <div id="signed-in" class="hidden">
        <p>Sesion iniciada.</p>
        <button type="button" class="btn btn-primary" id="continue-btn">Continuar</button>
        <button type="button" class="btn btn-ghost" id="logout-btn" style="margin-top: 12px;">Cerrar sesion</button>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { supabase, getSession, getProfile } from './js/supabase-client.js';
import { toast } from './js/utils.js';

const signedOut = document.getElementById('signed-out');
const signedIn = document.getElementById('signed-in');
const authMsg = document.getElementById('auth-msg');

async function routeIfSignedIn() {
  const session = await getSession();
  if (!session) return;
  signedOut.classList.add('hidden');
  signedIn.classList.remove('hidden');
  return session;
}

async function goToApp(user) {
  try {
    const profile = await getProfile(user.id);
    if (profile && profile.onboarding_done) {
      window.location.href = 'app.html';
    } else {
      window.location.href = 'onboarding.html';
    }
  } catch {
    window.location.href = 'onboarding.html';
  }
}

document.getElementById('google-btn').addEventListener('click', async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) {
    authMsg.textContent = 'No se pudo iniciar sesion. Intentalo de nuevo.';
    toast(error.message);
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  signedIn.classList.add('hidden');
  signedOut.classList.remove('hidden');
});

document.getElementById('continue-btn').addEventListener('click', async () => {
  const session = await getSession();
  if (session) goToApp(session.user);
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) {
    signedOut.classList.add('hidden');
    signedIn.classList.remove('hidden');
  }
});

routeIfSignedIn();
</script>
</body>
</html>
