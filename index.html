<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe</title>
<meta name="description" content="Recetas a tu punto. Feed personalizado y escaneo de nevera.">
<meta name="theme-color" content="#F7F2E7">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { overflow: hidden; }

  #ob-carousel {
    height: 100vh; height: 100dvh;
    width: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #ob-carousel::-webkit-scrollbar { display: none; }

  .ob-slide {
    flex: 0 0 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background-size: cover;
    background-position: center;
    position: relative;
    transition: opacity 0.25s ease, transform 0.25s ease;
    transform-origin: center;
  }

  .ob-hit {
    position: absolute;
    background: transparent;
    border: none;
  }

  .ob-dots {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top));
    left: 0; right: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    gap: 6px;
    pointer-events: none;
  }
  .ob-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(15,46,29,0.22);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
    transition: all 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .ob-dots span.active { background: #1E6B41; width: 20px; border-radius: 100px; }

  .email-modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-end;
  }
  .email-modal.hidden { display: none; }
  .email-modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(15,46,29,0.45);
    animation: fadeInUp 0.25s ease both;
  }
  .email-modal-sheet {
    position: relative; width: 100%;
    background: var(--bg-raised);
    border-radius: 26px 26px 0 0;
    padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
    animation: fadeInUp 0.3s var(--ease) both;
  }
  .email-modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 34px; height: 34px; border-radius: 50%; border: none;
    background: var(--bg-input); color: var(--fg-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; line-height: 1;
  }
  .email-modal-sheet h2 { margin-bottom: 18px; padding-right: 40px; }
  .email-toggle {
    background: none; border: none; width: 100%; text-align: center;
    color: var(--fg-dim); font-size: 0.85rem; font-weight: 600;
    text-decoration: underline; padding: 6px 0 0;
  }
</style>
</head>
<body>

<div id="splash">
  <span class="logo-lockup">
    <span class="wordmark">Nappe</span>
    <svg class="hat" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 24c-3 0-5-2.2-5-5s2-5 5-5c.4-3 3-5.3 6-5.3s5.6 2.3 6 5.3c2.6 0 4.8 1.9 5 4.4.1 2.8-2.1 5.1-5 5.1H9Z" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
  </span>
  <div class="bar"><i></i></div>
</div>

<div class="ob-dots" id="ob-dots"></div>

<div id="ob-carousel">
  <div class="ob-slide" data-img="img/onboarding/welcome.jpg"></div>
  <div class="ob-slide" data-img="img/onboarding/nevera.jpg"></div>
  <div class="ob-slide" data-img="img/onboarding/cocina.jpg"></div>
  <div class="ob-slide" data-img="img/onboarding/feed.jpg"></div>
  <div class="ob-slide" data-img="img/onboarding/login.jpg" id="login-slide">
    <button type="button" class="ob-hit" id="google-hit" aria-label="Continuar con Google"></button>
    <button type="button" class="ob-hit" id="email-hit" aria-label="Continuar con email"></button>
    <button type="button" class="ob-hit" id="signin-hit" aria-label="Iniciar sesion"></button>
  </div>
</div>

<div id="email-modal" class="email-modal hidden">
  <div class="email-modal-backdrop" id="email-modal-backdrop"></div>
  <div class="email-modal-sheet">
    <button type="button" class="email-modal-close" id="email-modal-close" aria-label="Cerrar">&times;</button>
    <h2 id="email-modal-title">Crear cuenta</h2>
    <form id="email-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email-input" required autocomplete="email">
      </div>
      <div class="field">
        <label>Contrasena</label>
        <input type="password" id="password-input" required autocomplete="current-password" minlength="6">
      </div>
      <p id="email-error" style="color:var(--danger); font-size:0.82rem; min-height:1.2em; margin-bottom:6px;"></p>
      <button type="submit" class="btn btn-primary" id="email-submit">Crear cuenta</button>
    </form>
    <button type="button" class="email-toggle" id="email-toggle-mode">¿Ya tienes cuenta? Inicia sesion</button>
  </div>
</div>

<script type="module">
import { supabase, getSession, getProfile } from './js/supabase-client.js';
import { toast } from './js/utils.js';

const carousel = document.getElementById('ob-carousel');
const slides = [...carousel.querySelectorAll('.ob-slide')];
const dotsWrap = document.getElementById('ob-dots');

slides.forEach((s) => { s.style.backgroundImage = `url('${s.dataset.img}')`; });

// puntos de progreso
slides.forEach((_, i) => {
  const d = document.createElement('span');
  if (i === 0) d.classList.add('active');
  dotsWrap.appendChild(d);
});
const dots = [...dotsWrap.children];

function updateFromScroll() {
  const width = carousel.clientWidth;
  const idx = Math.round(carousel.scrollLeft / width);
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  slides.forEach((s) => {
    const rect = s.getBoundingClientRect();
    const dist = Math.abs(rect.left) / width;
    const scale = Math.max(0.94, 1 - dist * 0.06);
    const opacity = Math.max(0.75, 1 - dist * 0.25);
    s.style.transform = `scale(${scale})`;
    s.style.opacity = opacity;
  });
}
carousel.addEventListener('scroll', () => window.requestAnimationFrame(updateFromScroll), { passive: true });
updateFromScroll();

// posiciona los botones invisibles exactamente sobre donde caen en la
// imagen real (matematica identica a background-size:cover), para que
// el hueco pulsable coincida siempre con el boton dibujado en la foto,
// sea cual sea el tamano de pantalla.
function placeHit(el, img, container, frac) {
  const cw = container.clientWidth, ch = container.clientHeight;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.max(cw / iw, ch / ih);
  const dw = iw * scale, dh = ih * scale;
  const offsetX = (cw - dw) / 2;
  const offsetY = (ch - dh) / 2;
  el.style.left = (offsetX + frac.left * dw) + 'px';
  el.style.top = (offsetY + frac.top * dh) + 'px';
  el.style.width = (frac.width * dw) + 'px';
  el.style.height = (frac.height * dh) + 'px';
}

function setupLoginHits() {
  const loginSlide = document.getElementById('login-slide');
  const img = new Image();
  img.onload = () => {
    const place = () => {
      placeHit(document.getElementById('google-hit'), img, loginSlide, { top: 0.612, left: 0.148, width: 0.70, height: 0.072 });
      placeHit(document.getElementById('email-hit'), img, loginSlide, { top: 0.692, left: 0.148, width: 0.70, height: 0.070 });
      placeHit(document.getElementById('signin-hit'), img, loginSlide, { top: 0.792, left: 0.30, width: 0.40, height: 0.058 });
    };
    place();
    window.addEventListener('resize', place);
  };
  img.src = loginSlide.dataset.img;
}
setupLoginHits();

// ---------- modal de email/contraseña ----------

const modal = document.getElementById('email-modal');
const emailForm = document.getElementById('email-form');
const emailInput = document.getElementById('email-input');
const passwordInput = document.getElementById('password-input');
const emailError = document.getElementById('email-error');
const emailSubmit = document.getElementById('email-submit');
const emailToggle = document.getElementById('email-toggle-mode');
const emailModalTitle = document.getElementById('email-modal-title');

let authMode = 'signup';

function setAuthMode(mode) {
  authMode = mode;
  emailError.textContent = '';
  if (mode === 'signin') {
    emailModalTitle.textContent = 'Iniciar sesion';
    emailSubmit.textContent = 'Iniciar sesion';
    emailToggle.textContent = '¿No tienes cuenta? Creala';
  } else {
    emailModalTitle.textContent = 'Crear cuenta';
    emailSubmit.textContent = 'Crear cuenta';
    emailToggle.textContent = '¿Ya tienes cuenta? Inicia sesion';
  }
}

function openModal(mode) {
  setAuthMode(mode);
  emailInput.value = '';
  passwordInput.value = '';
  modal.classList.remove('hidden');
  setTimeout(() => emailInput.focus(), 50);
}

function closeModal() {
  modal.classList.add('hidden');
}

document.getElementById('email-hit').addEventListener('click', () => openModal('signup'));
document.getElementById('signin-hit').addEventListener('click', () => openModal('signin'));
document.getElementById('email-modal-backdrop').addEventListener('click', closeModal);
document.getElementById('email-modal-close').addEventListener('click', closeModal);
emailToggle.addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));

emailForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  emailError.textContent = '';
  emailSubmit.disabled = true;
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  const { data, error } = authMode === 'signin'
    ? await supabase.auth.signInWithPassword({ email, password })
    : await supabase.auth.signUp({ email, password });

  emailSubmit.disabled = false;

  if (error) {
    emailError.textContent = error.message;
    return;
  }
  if (!data.session) {
    toast('Cuenta creada. Revisa tu correo para confirmarla.');
    closeModal();
    return;
  }
  closeModal();
  goToApp(data.session.user);
});

async function goToApp(user) {
  try {
    const profile = await getProfile(user.id);
    if (profile && profile.onboarding_done) {
      window.location.href = 'app.html';
    } else {
      window.location.href = 'onboarding.html';
    }
  } catch {
    window.location.href = 'onboarding.html';
  }
}

document.getElementById('google-hit').addEventListener('click', async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) toast(error.message);
});

supabase.auth.onAuthStateChange((_event, session) => {
  if (session) goToApp(session.user);
});

const minSplash = new Promise((r) => setTimeout(r, 900));

async function init() {
  const session = await getSession();
  if (session) {
    goToApp(session.user);
    return;
  }
  await minSplash;
  const splash = document.getElementById('splash');
  splash.classList.add('out');
  setTimeout(() => splash.remove(), 450);
}

init();
</script>
</body>
</html>
