<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe — Receta</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .hero { position: relative; width: 100%; aspect-ratio: 4/5; background: #17130f; overflow: hidden; }
  .hero img, .hero video { width: 100%; height: 100%; object-fit: cover; }
  .hero .back-btn {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 16px;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(20,15,10,0.65); color: #F7F2E5; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
  }
  .hero .save-btn {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px;
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: rgba(20,15,10,0.65); color: #F7F2E5; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .hero .save-btn.saved { color: var(--accent); }

  .content { padding: 22px 20px 40px; }
  .meta-strip { display: flex; gap: 18px; margin: 14px 0 20px; flex-wrap: wrap; }
  .meta-item { text-align: left; }
  .meta-item .num { font-family: var(--font-display); font-size: 1.3rem; display:block; }
  .meta-item .lbl { font-size: 0.68rem; text-transform: uppercase; color: var(--fg-faint); letter-spacing: 0.05em; }

  .nutri-box { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg-raised); border-radius: var(--radius); box-shadow: var(--shadow); margin: 18px 0; }
  .nutri-box div { padding: 14px 6px; text-align: center; border-right: 1px solid var(--line); }
  .nutri-box div:last-child { border-right: none; }
  .nutri-box .n { font-family: var(--font-display); font-size: 1.1rem; display: block; }
  .nutri-box .l { font-size: 0.62rem; text-transform: uppercase; color: var(--fg-faint); font-weight: 600; }

  .racion-stepper { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .racion-stepper button { width: 36px; height: 36px; border: none; border-radius: 50%; background: var(--bg-input); color: var(--fg); font-size: 1.1rem; font-weight: 700; }
  .racion-stepper .count { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; min-width: 6ch; text-align: center; }

  .ing-list { list-style: none; margin: 0; padding: 0; background: var(--bg-raised); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .ing-list li { display: flex; justify-content: space-between; padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 0.95rem; font-weight: 500; }
  .ing-list li:last-child { border-bottom: none; }
  .ing-list li .amt { color: var(--fg-dim); flex-shrink: 0; margin-left: 12px; font-weight: 600; }

  /* modo cocina */
  #cook-mode {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    display: flex; flex-direction: column;
  }
  .cook-top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 18px 14px; }
  .cook-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 26px; text-align: center; }
  .cook-step-num { font-family: var(--font-display); color: var(--accent); font-size: 1rem; text-transform: uppercase; margin-bottom: 14px; }
  .cook-step-text { font-family: var(--font-display); font-size: 1.9rem; text-transform: none; line-height: 1.2; }
  .cook-timer { margin-top: 26px; font-family: var(--font-display); font-size: 2.6rem; }
  .cook-timer-controls { margin-top: 10px; display: flex; gap: 10px; }
  .cook-nav { display: flex; gap: 10px; padding: 16px 18px calc(16px + env(safe-area-inset-bottom)); }
  .cook-nav .btn { flex: 1; }
</style>
</head>
<body>
<div class="screen">
  <div class="hero" id="hero">
    <button class="back-btn" id="back-btn">&larr;</button>
    <button class="save-btn" id="save-btn">&#9733;</button>
    <div id="hero-media"></div>
  </div>

  <div class="content grow">
    <h1 id="r-titulo">Cargando...</h1>
    <p id="r-descripcion"></p>

    <div class="meta-strip">
      <div class="meta-item"><span class="num" id="r-minutos">-</span><span class="lbl">Minutos</span></div>
      <div class="meta-item"><span class="num" id="r-dificultad">-</span><span class="lbl">Dificultad</span></div>
      <div class="meta-item"><span class="num" id="r-cocina">-</span><span class="lbl">Cocina</span></div>
    </div>

    <div class="nutri-box">
      <div><span class="n" id="r-kcal">-</span><span class="l">Kcal</span></div>
      <div><span class="n" id="r-proteina">-</span><span class="l">Proteina</span></div>
      <div><span class="n" id="r-carbos">-</span><span class="l">Carbos</span></div>
      <div><span class="n" id="r-grasa">-</span><span class="l">Grasa</span></div>
    </div>
    <p style="font-size:0.72rem; color:var(--fg-faint); margin-top:-10px;">Informativo, por racion. No es un objetivo diario.</p>

    <h3 style="margin-top:26px;">Ingredientes</h3>
    <div class="racion-stepper">
      <button id="racion-minus">&minus;</button>
      <span class="count"><span id="racion-count">4</span> raciones</span>
      <button id="racion-plus">&plus;</button>
    </div>
    <ul class="ing-list" id="ing-list"></ul>

    <button class="btn btn-primary" id="cook-btn" style="margin-top:28px;">Empezar a cocinar</button>
  </div>
</div>

<!-- MODO COCINA -->
<div id="cook-mode" class="hidden">
  <div class="cook-top">
    <div class="progress-dots" id="cook-dots"></div>
    <button class="btn-icon btn-ghost" id="cook-close" style="width:38px; height:38px; font-size:1rem;">&times;</button>
  </div>
  <div class="cook-body">
    <div class="cook-step-num" id="cook-step-num">Paso 1</div>
    <div class="cook-step-text" id="cook-step-text"></div>
    <div id="cook-timer-wrap" class="hidden">
      <div class="cook-timer" id="cook-timer">00:00</div>
      <div class="cook-timer-controls">
        <button class="btn btn-ghost btn-sm" id="timer-toggle">Iniciar</button>
        <button class="btn btn-ghost btn-sm" id="timer-reset">Reiniciar</button>
      </div>
    </div>
  </div>
  <div class="cook-nav">
    <button class="btn btn-ghost" id="cook-prev">Anterior</button>
    <button class="btn btn-primary" id="cook-next">Siguiente</button>
  </div>
</div>

<script type="module" src="js/receta.js"></script>
</body>
</html>
