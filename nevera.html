<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe — Nevera</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .capture-box {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    aspect-ratio: 4/3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--fg-faint);
    overflow: hidden;
    position: relative;
    background: var(--bg-raised);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .capture-box:active { transform: scale(0.98); border-color: var(--accent); }
  .capture-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .capture-box .hint { position: relative; z-index: 1; text-align: center; padding: 0 20px; font-weight: 600; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: none; border-radius: var(--radius-pill); padding: 9px 9px 9px 15px;
    font-size: 0.85rem; font-weight: 600; background: var(--bg-raised); box-shadow: var(--shadow);
    animation: popIn 0.3s cubic-bezier(.34,1.56,.64,1) both;
  }
  .chip button { background: none; border: none; color: var(--fg-faint); font-size: 1rem; padding: 0 6px; }
  .add-chip-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .add-chip-row input { flex: 1; padding: 14px 16px; background: var(--bg-input); border: 1px solid transparent; border-radius: var(--radius-sm); color: var(--fg); }

  .match-row { display: flex; gap: 12px; padding: 14px; margin-bottom: 10px; background: var(--bg-raised); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; animation: fadeInUp 0.4s cubic-bezier(.2,.8,.2,1) both; transition: transform 0.15s ease; }
  .match-row:active { transform: scale(0.98); }
  #results-list .match-row:nth-child(1) { animation-delay: 0.03s; }
  #results-list .match-row:nth-child(2) { animation-delay: 0.07s; }
  #results-list .match-row:nth-child(3) { animation-delay: 0.11s; }
  #results-list .match-row:nth-child(4) { animation-delay: 0.15s; }
  #results-list .match-row:nth-child(n+5) { animation-delay: 0.19s; }
  .match-row img { width: 64px; height: 64px; object-fit: cover; background: var(--bg-input); border-radius: var(--radius-sm); flex-shrink: 0; }
  .match-row .info { flex: 1; min-width: 0; }
  .match-row .info strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }
  .match-pct { font-family: var(--font-display); color: var(--accent); font-weight: 800; font-size: 1.1rem; flex-shrink: 0; }
  .missing { font-size: 0.75rem; color: var(--fg-faint); margin-top: 4px; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <span class="brand">Nevera</span>
  </div>

  <div class="wrap grow" style="padding: 20px 20px 20px;">

    <!-- PASO 1: captura -->
    <div id="capture-step">
      <p>Haz una foto de tu nevera o despensa y te diremos que puedes cocinar.</p>
      <label class="capture-box" id="capture-box">
        <span class="hint" id="capture-hint">Toca para hacer una foto</span>
        <img id="capture-preview" class="hidden">
        <input type="file" accept="image/*" capture="environment" id="file-input" style="display:none;">
      </label>
      <button class="btn btn-primary" id="analyze-btn" style="margin-top:16px;" disabled>Analizar foto</button>
      <p id="analyze-status" style="font-size:0.82rem; margin-top:10px;"></p>
    </div>

    <!-- PASO 2: edicion de ingredientes -->
    <div id="edit-step" class="hidden">
      <h3>Ingredientes detectados</h3>
      <p>Revisa la lista, quita lo que no cuadre o añade lo que falte.</p>
      <div class="chip-list" id="chip-list"></div>
      <div class="add-chip-row">
        <input type="text" id="new-ing-input" placeholder="Añadir ingrediente...">
        <button class="btn btn-ghost btn-sm" id="add-ing-btn">Añadir</button>
      </div>
      <button class="btn btn-primary" id="search-btn" style="margin-top:14px;">Buscar recetas</button>
      <button class="btn btn-ghost" id="retake-btn" style="margin-top:10px;">Repetir foto</button>
    </div>

    <!-- PASO 3: resultados -->
    <div id="results-step" class="hidden">
      <h3>Recetas segun tu nevera</h3>
      <div id="results-list"></div>
      <div id="results-empty" class="empty-state hidden"><p>Ninguna receta encaja todavia con estos ingredientes.</p></div>
      <button class="btn btn-ghost" id="back-to-edit-btn" style="margin-top:16px;">Editar ingredientes</button>
    </div>

  </div>

  <nav class="tabbar">
    <a href="app.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M9 11v11"/><path d="M17 2c-1.5 0-3 1.5-3 4v3c0 1.5.5 2 2 2v10"/></svg>
      <span>Feed</span>
    </a>
    <a href="nevera.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="8" y1="5" x2="8" y2="7"/><line x1="8" y1="13" x2="8" y2="15"/></svg>
      <span>Nevera</span>
    </a>
    <a href="guardadas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Guardadas</span>
    </a>
  </nav>
</div>

<script type="module" src="js/nevera.js"></script>
</body>
</html>
