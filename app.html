<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .home-top { display: flex; align-items: center; justify-content: space-between; padding: calc(18px + env(safe-area-inset-top)) 20px 4px; }
  .home-wrap { padding: 4px 20px 24px; }
  .greet { margin: 6px 0 22px; }
  .greet p { margin-top: 4px; }
  .sec-label { font-size: 0.72rem; font-weight: 700; color: var(--fg-faint); letter-spacing: 0.06em; text-transform: uppercase; margin: 30px 0 14px; }
</style>
</head>
<body>

<div class="screen">

  <div class="home-top">
    <span class="logo-lockup">
      <span class="wordmark" style="font-size:1.3rem;">Nappe</span>
      <svg class="hat" width="19" height="19" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 24c-3 0-5-2.2-5-5s2-5 5-5c.4-3 3-5.3 6-5.3s5.6 2.3 6 5.3c2.6 0 4.8 1.9 5 4.4.1 2.8-2.1 5.1-5 5.1H9Z" stroke-width="2.2" stroke-linejoin="round"/>
      </svg>
    </span>
    <div class="avatar" id="avatar">N</div>
  </div>

  <div class="wrap grow home-wrap">
    <div class="greet rv d1">
      <h2 id="greet-h">Hola</h2>
      <p>¿Que te apetece cocinar hoy?</p>
    </div>

    <a href="nevera.html" class="scan-cta rv d2" style="display:block;">
      <strong>Escanea tu nevera</strong>
      <span>Haz una foto de lo que tienes y te decimos que puedes cocinar hoy mismo.</span>
    </a>

    <div class="sec-label rv d3">Para ti</div>
    <div id="feed" class="stagger"></div>

    <div class="empty-state hidden" id="empty-state"><p>Todavia no hay recetas publicadas. Vuelve pronto.</p></div>
    <div class="center" id="loading-state" style="padding:60px 0;"><div class="spinner"></div></div>
  </div>

  <nav class="tabbar">
    <a href="app.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M9 11v11"/><path d="M17 2c-1.5 0-3 1.5-3 4v3c0 1.5.5 2 2 2v10"/></svg>
      <span>Feed</span>
    </a>
    <a href="nevera.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="8" y1="5" x2="8" y2="7"/><line x1="8" y1="13" x2="8" y2="15"/></svg>
      <span>Nevera</span>
    </a>
    <a href="guardadas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Guardadas</span>
    </a>
  </nav>
</div>

<script type="module" src="js/feed.js"></script>
</body>
</html>
