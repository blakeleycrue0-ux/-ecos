<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { overflow: hidden; }
  #feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .card {
    position: relative;
    height: 100vh; height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    background: #17130f;
  }
  .card .media { position: absolute; inset: 0; }
  .card .media img, .card .media video { width: 100%; height: 100%; object-fit: cover; }
  .card .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.45) 100%);
  }
  .card .info {
    position: relative;
    padding: 0 20px calc(110px + env(safe-area-inset-bottom)) 20px;
    color: #F7F2E5;
  }
  .card .info h2 { font-size: 2rem; margin-bottom: 10px; }
  .card .info .meta-row { color: #d8d4c8; }
  .card .info .tag { background: rgba(255,255,255,0.16); color: #F7F2E5; margin-right: 6px; }

  .card .actions {
    position: absolute;
    right: 14px;
    bottom: calc(120px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 3;
  }
  .card .actions button {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(244,241,232,0.5);
    background: rgba(20,15,10,0.55);
    color: #F7F2E5;
    font-size: 1.25rem;
    display: flex; align-items: center; justify-content: center;
  }
  .card .actions button.save.active { color: var(--accent); border-color: var(--accent); }
  .card .actions .lbl { display:block; font-size:0.62rem; font-weight:600; text-align:center; margin-top:4px; color:#d8d4c8; }

  .tabbar-overlay {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
    padding-top: 30px;
  }
  .tabbar-overlay .tabbar { background: transparent; box-shadow: none; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .tabbar-overlay .tabbar a { color: rgba(244,241,232,0.65); }
  .tabbar-overlay .tabbar a.active { color: var(--accent); }
</style>
</head>
<body>

<div id="feed"></div>

<div class="empty-state hidden" id="empty-state" style="position:fixed; inset:0; align-items:center;">
  <p>Todavia no hay recetas publicadas. Vuelve pronto.</p>
</div>

<div class="center" id="loading-state" style="position:fixed; inset:0;">
  <div class="spinner"></div>
</div>

<div class="tabbar-overlay">
  <nav class="tabbar">
    <a href="app.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M9 11v11"/><path d="M17 2c-1.5 0-3 1.5-3 4v3c0 1.5.5 2 2 2v10"/></svg>
      <span>Feed</span>
    </a>
    <a href="nevera.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="8" y1="5" x2="8" y2="7"/><line x1="8" y1="13" x2="8" y2="15"/></svg>
      <span>Nevera</span>
    </a>
    <a href="guardadas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Guardadas</span>
    </a>
  </nav>
</div>

<script type="module" src="js/feed.js"></script>
</body>
</html>
