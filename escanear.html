<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe — Escanear</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .capture-box {
    border: 2px dashed var(--line);
    border-radius: var(--radius);
    aspect-ratio: 4/3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--fg-faint);
    overflow: hidden;
    position: relative;
    background: var(--bg-raised);
    transition: transform 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
  }
  .capture-box:active { transform: scale(0.98); border-color: var(--accent); }
  .capture-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .capture-box .hint { position: relative; z-index: 1; text-align: center; padding: 0 20px; font-weight: 600; }

  .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .analyzing { text-align: center; padding: 26px 0 8px; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <span class="brand">Escanear</span>
  </div>

  <div class="wrap grow" style="padding: 14px 20px 20px;">

    <!-- PASO 1: captura -->
    <div id="capture-step">
      <p>Hazle una foto a tu plato y te decimos las calorias y los macros.</p>
      <div class="capture-box" id="capture-box" role="button" tabindex="0">
        <span class="hint" id="capture-hint">Toca para hacer una foto o elegir de la galeria</span>
        <img id="capture-preview" class="hidden">
      </div>
      <input type="file" accept="image/*" id="file-input" style="display:none;">
      <button class="btn btn-primary" id="analyze-btn" style="margin-top:16px;" disabled>Analizar plato</button>
      <div class="analyzing hidden" id="analyzing">
        <div class="dot-loader"><i></i><i></i><i></i></div>
        <p style="margin-top:12px;">Analizando tu plato...</p>
      </div>
      <button class="btn btn-ghost" id="manual-btn" style="margin-top:10px;">Añadir a mano sin foto</button>
    </div>

    <!-- PASO 2: revision -->
    <div id="review-step" class="hidden">
      <h3 id="review-title">Revisa y guarda</h3>
      <p>Puedes corregir cualquier valor antes de guardar.</p>

      <div class="field">
        <label>Comida</label>
        <input type="text" id="f-nombre" placeholder="Ej. ensalada de pollo">
      </div>
      <div class="field">
        <label>Calorias (kcal)</label>
        <input type="number" id="f-kcal" min="0" inputmode="numeric">
      </div>
      <div class="macro-grid">
        <div class="field"><label>Proteina (g)</label><input type="number" id="f-proteina" min="0" step="0.1" inputmode="decimal"></div>
        <div class="field"><label>Carbos (g)</label><input type="number" id="f-carbos" min="0" step="0.1" inputmode="decimal"></div>
        <div class="field"><label>Grasa (g)</label><input type="number" id="f-grasa" min="0" step="0.1" inputmode="decimal"></div>
      </div>

      <button class="btn btn-primary" id="save-btn" style="margin-top:8px;">Guardar comida</button>
      <button class="btn btn-ghost" id="retry-btn" style="margin-top:10px;">Volver a empezar</button>
    </div>

  </div>

  <nav class="tabbar">
    <a href="app.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 3.5"/></svg>
      <span>Hoy</span>
    </a>
    <a href="escanear.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>Escanear</span>
    </a>
    <a href="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

<script type="module" src="js/escanear.js"></script>
</body>
</html>
