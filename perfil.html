<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe — Perfil</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .profile-box { background: var(--bg-raised); border: var(--edge); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; animation: fadeInUp 0.4s var(--ease) both; }
  .profile-box .row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
  .profile-box .row:last-of-type { border-bottom: none; }
  .profile-box .lbl { color: var(--fg-faint); }

  .day-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; margin-bottom: 8px; background: var(--bg-raised); border: var(--edge); border-radius: var(--radius); animation: fadeInUp 0.4s var(--ease) both; }
  .day-row .d { font-weight: 700; font-size: 0.9rem; text-transform: capitalize; }
  .day-row .k { font-family: var(--font-display); font-weight: 800; }
  .day-row .k small { color: var(--fg-faint); font-weight: 600; font-family: var(--font-body); }
  .day-row.over .k { color: var(--danger); }
  .sec-label { font-size: 0.72rem; font-weight: 700; color: var(--fg-faint); letter-spacing: 0.06em; text-transform: uppercase; margin: 22px 0 12px; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <span class="brand">Perfil</span>
  </div>

  <div class="wrap grow" style="padding: 14px 20px 30px;">

    <div class="profile-box">
      <h3>Tu plan</h3>
      <div class="row"><span class="lbl">Objetivo</span><span id="p-objetivo">-</span></div>
      <div class="row"><span class="lbl">Calorias diarias</span><span id="p-kcal">-</span></div>
      <div class="row"><span class="lbl">Proteina</span><span id="p-prot">-</span></div>
      <div class="row"><span class="lbl">Carbohidratos</span><span id="p-carb">-</span></div>
      <div class="row"><span class="lbl">Grasa</span><span id="p-grasa">-</span></div>
      <a href="onboarding.html" class="btn btn-ghost btn-sm" style="margin-top:14px; display:inline-block;">Recalcular mi plan</a>
    </div>

    <div class="sec-label">Ultimos 7 dias</div>
    <div id="days-list"></div>
    <div class="empty-state hidden" id="days-empty" style="padding:20px; flex:none;"><p>Todavia no hay dias registrados.</p></div>

    <button class="btn btn-ghost" id="logout-btn" style="margin-top:18px;">Cerrar sesion</button>

  </div>

  <nav class="tabbar">
    <a href="app.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 3.5"/></svg>
      <span>Hoy</span>
    </a>
    <a href="escanear.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
      <span>Escanear</span>
    </a>
    <a href="perfil.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

<script type="module" src="js/perfil.js"></script>
</body>
</html>
