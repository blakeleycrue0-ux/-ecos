<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nappe — Guardadas</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .subtabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .subtabs button {
    flex: 1; padding: 11px; border: none; border-radius: var(--radius-pill); background: var(--bg-raised);
    box-shadow: var(--shadow);
    color: var(--fg-dim); font-family: var(--font-body); font-weight: 700;
    font-size: 0.82rem;
  }
  .subtabs button.active { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
  .subtabs button { transition: transform 0.15s ease; }
  .subtabs button:active { transform: scale(0.95); }

  .recipe-card-row { display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; background: var(--bg-raised); border-radius: var(--radius); box-shadow: var(--shadow); cursor: pointer; animation: fadeInUp 0.4s cubic-bezier(.2,.8,.2,1) both; transition: transform 0.15s ease; }
  .recipe-card-row:active { transform: scale(0.98); }
  #saves-list .recipe-card-row:nth-child(1), #cooked-list .recipe-card-row:nth-child(1) { animation-delay: 0.03s; }
  #saves-list .recipe-card-row:nth-child(2), #cooked-list .recipe-card-row:nth-child(2) { animation-delay: 0.07s; }
  #saves-list .recipe-card-row:nth-child(3), #cooked-list .recipe-card-row:nth-child(3) { animation-delay: 0.11s; }
  #saves-list .recipe-card-row:nth-child(4), #cooked-list .recipe-card-row:nth-child(4) { animation-delay: 0.15s; }
  #saves-list .recipe-card-row:nth-child(5), #cooked-list .recipe-card-row:nth-child(5) { animation-delay: 0.19s; }
  #saves-list .recipe-card-row:nth-child(n+6), #cooked-list .recipe-card-row:nth-child(n+6) { animation-delay: 0.22s; }
  .recipe-card-row img { width: 72px; height: 72px; object-fit: cover; background: var(--bg-input); border-radius: var(--radius-sm); flex-shrink: 0; }
  .recipe-card-row .info { flex: 1; min-width: 0; }
  .recipe-card-row .info strong { display: block; font-family: var(--font-display); font-size: 1.05rem; }
  .recipe-card-row .info span { font-size: 0.78rem; color: var(--fg-faint); }

  .profile-box { background: var(--bg-raised); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-top: 28px; }
  .profile-box .row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.9rem; border-bottom: 1px solid var(--line); }
  .profile-box .row:last-of-type { border-bottom: none; }
  .profile-box .lbl { color: var(--fg-faint); }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <span class="brand">Guardadas</span>
  </div>

  <div class="wrap grow" style="padding: 20px 20px 30px;">

    <div class="subtabs">
      <button type="button" id="tab-saves" class="active">Guardadas</button>
      <button type="button" id="tab-cooked">Cocinadas</button>
    </div>

    <div id="saves-list" class="stagger"></div>
    <div id="saves-empty" class="empty-state hidden">
      <div class="feature-badge" style="margin-bottom:14px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      </div>
      <p>Todavia no has guardado ninguna receta.</p>
    </div>

    <div id="cooked-list" class="hidden stagger"></div>
    <div id="cooked-empty" class="empty-state hidden"><p>Todavia no has cocinado ninguna receta.</p></div>

    <div class="profile-box">
      <h3>Tu perfil</h3>
      <div class="row"><span class="lbl">Usuario</span><span id="p-username">-</span></div>
      <div class="row"><span class="lbl">Cocinas favoritas</span><span id="p-cocinas">-</span></div>
      <div class="row"><span class="lbl">Nivel</span><span id="p-nivel">-</span></div>
      <div class="row"><span class="lbl">Tiempo habitual</span><span id="p-tiempo">-</span></div>
      <a href="onboarding.html" class="btn btn-ghost btn-sm" style="margin-top:16px; display:inline-block;">Editar mis gustos</a>
      <button class="btn btn-ghost btn-sm" id="logout-btn" style="margin-top:10px;">Cerrar sesion</button>
    </div>

  </div>

  <nav class="tabbar">
    <a href="app.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V2"/><path d="M9 11v11"/><path d="M17 2c-1.5 0-3 1.5-3 4v3c0 1.5.5 2 2 2v10"/></svg>
      <span>Feed</span>
    </a>
    <a href="nevera.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="8" y1="5" x2="8" y2="7"/><line x1="8" y1="13" x2="8" y2="15"/></svg>
      <span>Nevera</span>
    </a>
    <a href="guardadas.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>Guardadas</span>
    </a>
  </nav>
</div>

<script type="module" src="js/guardadas.js"></script>
</body>
</html>
